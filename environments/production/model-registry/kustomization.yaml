apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service-account.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - network-policy.yaml
configMapGenerator:
  - name: mlflow-config
    namespace: mlops
    literals:
      - POSTGRES_HOST=REPLACE_RDS_ENDPOINT
      - POSTGRES_DB=mlflow
      - MLFLOW_ARTIFACT_BUCKET=REPLACE_MLFLOW_ARTIFACT_BUCKET
generatorOptions: {disableNameSuffixHash: true}
images:
  - name: iris-mlflow
    newName: REPLACE_ECR_MLFLOW_REPOSITORY
    newTag: REPLACE_IMAGE_TAG
