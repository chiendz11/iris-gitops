apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: mlflow-database, namespace: mlops}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target: {name: mlflow-database, creationPolicy: Owner}
  data:
    - secretKey: POSTGRES_USER
      remoteRef: {key: REPLACE_RDS_MASTER_SECRET_ARN, property: username}
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: REPLACE_RDS_MASTER_SECRET_ARN, property: password}
