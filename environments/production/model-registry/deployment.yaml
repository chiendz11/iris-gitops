apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: mlops, labels: {app: mlflow}}
spec:
  replicas: 2
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      serviceAccountName: mlflow
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mlflow
          image: iris-mlflow
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: mlflow-config}
            - secretRef: {name: mlflow-database}
          ports: [{name: http, containerPort: 5000}]
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - {name: Host, value: mlflow.mlops.svc.cluster.local}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - {name: Host, value: mlflow.mlops.svc.cluster.local}
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - {name: Host, value: mlflow.mlops.svc.cluster.local}
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 10001
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
