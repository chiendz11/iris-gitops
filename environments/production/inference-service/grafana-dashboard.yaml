apiVersion: v1
kind: ConfigMap
metadata:
  name: iris-mlops-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1"}
data:
  iris-mlops.json: |
    {
      "title": "Iris MLOps Serving",
      "uid": "iris-mlops",
      "schemaVersion": 39,
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {"type":"timeseries","title":"Requests / second","gridPos":{"x":0,"y":0,"w":8,"h":8},"targets":[{"expr":"sum(rate(iris_prediction_requests_total{service=\"iris-classifier\"}[5m]))"}]},
        {"type":"timeseries","title":"p95 latency","gridPos":{"x":8,"y":0,"w":8,"h":8},"targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(iris_prediction_latency_seconds_bucket{service=\"iris-classifier\"}[5m])))"}]},
        {"type":"timeseries","title":"Prediction distribution","gridPos":{"x":16,"y":0,"w":8,"h":8},"targets":[{"expr":"sum by (species) (rate(iris_predictions_total{service=\"iris-classifier\"}[5m]))"}]},
        {"type":"timeseries","title":"Feature drift z-score","gridPos":{"x":0,"y":8,"w":24,"h":8},"targets":[{"expr":"iris_feature_drift_zscore{service=\"iris-classifier\"}","legendFormat":"{{feature}}"}]}
      ]
    }
