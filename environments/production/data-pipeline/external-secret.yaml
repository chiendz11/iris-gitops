apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: model-promotion-github-app
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: model-promotion-github-app
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: iris-mlops-prod/github-app/model-promoter
        property: client_id
    - secretKey: private_key
      remoteRef:
        key: iris-mlops-prod/github-app/model-promoter
        property: private_key
