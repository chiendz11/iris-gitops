apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata: {name: iris-model-lifecycle, namespace: argo}
spec:
  serviceAccountName: iris-training
  entrypoint: lifecycle
  onExit: report-status
  securityContext:
    fsGroup: 10001
  activeDeadlineSeconds: 28800
  synchronization:
    mutexes:
      - name: iris-model-promotion
  arguments:
    parameters:
      - {name: training-image, value: TRAINING_IMAGE_FROM_EVENT_REQUIRED}
      - {name: release-automation-image, value: 980794397912.dkr.ecr.ap-southeast-1.amazonaws.com/iris-mlops-prod/dispatcher@sha256:0451fab05cf46783a0b0d5f4366837102f4570db4f2b963f232fc1b13e946bc9}
      - {name: dataset-bucket, value: iris-mlops-prod-dvc-794f8f04}
      - {name: dataset-key, value: datasets/iris.csv}
      - {name: dataset-version, value: unknown}
      - {name: source-sha, value: unknown}
      - {name: mlflow-tracking-uri, value: "http://mlflow.mlops.svc.cluster.local:5000"}
      - {name: prometheus-url, value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"}
      - {name: inference-url, value: "http://iris-classifier-predictor.mlops.svc.cluster.local/v1/models/iris:predict"}
      - {name: gitops-repository, value: chiendz11/iris-gitops}
      - {name: recovery-version, value: unset}
      - {name: expected-champion-version, value: unset}
  volumeClaimTemplates:
    - metadata: {name: workspace}
      spec:
        storageClassName: iris-training-gp3
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
  # Each workflow gets a PVC; CSI provisions the PV/EBS disk. Clean temporary
  # workspaces on success OR failure. Durable artifacts are stored in S3.
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  metrics:
    prometheus:
      - name: iris_model_lifecycle_failures_total
        help: Failed or errored Iris lifecycle runs requiring operator investigation
        when: "{{status}} != Succeeded"
        counter: {value: "1"}
  templates:
    # Operator-only entrypoint after the recovery PR is merged. It neither trains
    # nor changes Kubernetes desired state, and shares the lifecycle mutex.
    - name: recovery-finalize
      steps:
        - - name: wait-stable
            template: wait-rollout
            arguments:
              parameters:
                - {name: traffic, value: absent}
                - {name: version, value: "{{workflow.parameters.recovery-version}}"}
        - - {name: smoke-restored-model, template: smoke}
        - - name: reconcile-champion
            template: promote-registry-alias
            arguments:
              parameters:
                - {name: version, value: "{{workflow.parameters.recovery-version}}"}
                - {name: expected-current-version, value: "{{workflow.parameters.expected-champion-version}}"}

    - name: lifecycle
      dag:
        tasks:
          - {name: fetch-dataset, template: fetch}
          - {name: train, depends: fetch-dataset.Succeeded, template: train}
          - name: propose-canary-10
            depends: train.Succeeded
            when: "'{{tasks.train.outputs.parameters.quality-gate}}' == 'true' && '{{tasks.train.outputs.parameters.bootstrap-required}}' == 'false'"
            template: dispatch-release
            arguments:
              parameters:
                - {name: action, value: canary}
          - name: wait-canary-10
            depends: propose-canary-10.Succeeded
            template: wait-rollout
            arguments:
              parameters:
                - {name: traffic, value: "10"}
                - {name: version, value: "{{tasks.train.outputs.parameters.model-version}}"}
          - name: propose-bootstrap-rollout
            depends: train.Succeeded
            when: "'{{tasks.train.outputs.parameters.quality-gate}}' == 'true' && '{{tasks.train.outputs.parameters.bootstrap-required}}' == 'true'"
            template: dispatch-release
            arguments:
              parameters:
                - {name: action, value: bootstrap}
          - name: wait-bootstrap-rollout
            depends: propose-bootstrap-rollout.Succeeded
            template: wait-rollout
            arguments:
              parameters:
                - {name: traffic, value: absent}
                - {name: version, value: "{{tasks.train.outputs.parameters.model-version}}"}
          - name: bootstrap-smoke
            depends: wait-bootstrap-rollout.Succeeded
            template: smoke
          - name: bootstrap-promote-registry
            depends: bootstrap-smoke.Succeeded
            template: promote-registry-alias
            arguments:
              parameters:
                - {name: version, value: "{{tasks.train.outputs.parameters.model-version}}"}
                - {name: expected-current-version, value: none}
          - {name: generate-traffic, depends: wait-canary-10.Succeeded, template: smoke}
          - name: observe-canary
            depends: generate-traffic.Succeeded
            template: observe
            arguments:
              parameters:
                - {name: version, value: "{{tasks.train.outputs.parameters.model-version}}"}
          - name: propose-rollout-100
            depends: observe-canary.Succeeded
            when: "'{{tasks.observe-canary.outputs.parameters.passed}}' == 'true'"
            template: dispatch-release
            arguments:
              parameters:
                - {name: action, value: promote}
          - name: wait-rollout-100
            depends: propose-rollout-100.Succeeded
            template: wait-rollout
            arguments:
              parameters:
                - {name: traffic, value: absent}
                - {name: version, value: "{{tasks.train.outputs.parameters.model-version}}"}
          - name: stable-smoke
            depends: wait-rollout-100.Succeeded
            template: smoke
          - name: promote-registry
            depends: stable-smoke.Succeeded
            template: promote-registry-alias
            arguments:
              parameters:
                - {name: version, value: "{{tasks.train.outputs.parameters.model-version}}"}
                - {name: expected-current-version, value: "{{tasks.train.outputs.parameters.baseline-model-version}}"}
          - name: propose-rollback
            depends: observe-canary.Succeeded
            when: "'{{tasks.observe-canary.outputs.parameters.decision}}' == 'reject'"
            template: dispatch-release
            arguments:
              parameters:
                - {name: action, value: rollback}
          - name: wait-rollback
            depends: propose-rollback.Succeeded
            template: wait-rollout
            arguments:
              parameters:
                - {name: traffic, value: absent}
                - {name: version, value: "{{tasks.train.outputs.parameters.baseline-model-version}}"}
          - {name: rollback-smoke, depends: wait-rollback.Succeeded, template: smoke}

    - name: fetch
      container:
        image: "{{workflow.parameters.training-image}}"
        command: [python, -m, iris_pipeline.data.fetch]
        args: [--bucket, "{{workflow.parameters.dataset-bucket}}", --key, "{{workflow.parameters.dataset-key}}", --destination, /workspace/data/iris.csv]
        volumeMounts: [{name: workspace, mountPath: /workspace}]

    - name: train
      outputs:
        parameters:
          - {name: model-version, valueFrom: {path: /app/outputs/model-version.txt}}
          - {name: quality-gate, valueFrom: {path: /app/outputs/quality-gate.txt}}
          - {name: bootstrap-required, valueFrom: {path: /app/outputs/bootstrap-required.txt}}
          - {name: baseline-model-version, valueFrom: {path: /app/outputs/baseline-model-version.txt}}
        artifacts:
          - {name: model-result, path: /app/outputs/model-result.json}
      container:
        image: "{{workflow.parameters.training-image}}"
        command: [python, -m, iris_pipeline.training.train]
        args: [/workspace/data/iris.csv, params.yaml]
        workingDir: /app
        env:
          - {name: MLFLOW_TRACKING_URI, value: "{{workflow.parameters.mlflow-tracking-uri}}"}
          - {name: REGISTER_MODEL, value: "true"}
          - {name: MODEL_NAME, value: iris-classifier}
          - {name: DATASET_VERSION, value: "{{workflow.parameters.dataset-version}}"}
          - {name: GIT_COMMIT, value: "{{workflow.parameters.source-sha}}"}
        volumeMounts:
          - {name: workspace, mountPath: /app/outputs}
          - {name: workspace, mountPath: /workspace}

    - name: smoke
      container:
        image: "{{workflow.parameters.release-automation-image}}"
        command: [python, -m, automation.model_release.smoke]
        # ~100s of traffic spans multiple 30s scrapes; short bursts can disappear
        # before Prometheus has two counter samples for rate/increase.
        args: [--url, "{{workflow.parameters.inference-url}}", --requests, "500", --interval, "0.2"]

    - name: observe
      inputs:
        parameters: [{name: version}]
      outputs:
        parameters:
          - {name: passed, valueFrom: {path: /tmp/canary-passed.txt}}
          - {name: decision, valueFrom: {path: /tmp/canary-decision.txt}}
        artifacts:
          - {name: canary-result, path: /tmp/canary-result.json}
      container:
        image: "{{workflow.parameters.release-automation-image}}"
        command: [python, -m, automation.model_release.canary_evaluator]
        args: [--prometheus-url, "{{workflow.parameters.prometheus-url}}", --service, iris-classifier, --model-version, "{{inputs.parameters.version}}", --max-p95, "0.5", --max-error-rate, "0.01", --min-requests, "20"]

    - name: promote-registry-alias
      inputs:
        parameters: [{name: version}, {name: expected-current-version}]
      container:
        image: "{{workflow.parameters.release-automation-image}}"
        command: [python, -m, automation.model_release.registry_promoter]
        args: [--tracking-uri, "{{workflow.parameters.mlflow-tracking-uri}}", --model-name, iris-classifier, --version, "{{inputs.parameters.version}}", --expected-current-version, "{{inputs.parameters.expected-current-version}}"]

    - name: dispatch-release
      inputs:
        parameters: [{name: action}]
      container:
        image: "{{workflow.parameters.release-automation-image}}"
        command: [python, -m, automation.model_release.dispatcher]
        args:
          - --repository
          - "{{workflow.parameters.gitops-repository}}"
          - --model-result-contract
          - /workspace/model-result.json
          - --action
          - "{{inputs.parameters.action}}"
          - --change-id
          - "{{workflow.uid}}"
        volumeMounts: [{name: workspace, mountPath: /workspace, readOnly: true}]
        env:
          - name: GITHUB_APP_CLIENT_ID
            valueFrom:
              secretKeyRef: {name: model-release-publisher-github-app, key: client_id}
          - name: GITHUB_APP_PRIVATE_KEY
            valueFrom:
              secretKeyRef: {name: model-release-publisher-github-app, key: private_key}

    - name: wait-rollout
      inputs:
        parameters: [{name: traffic}, {name: version}]
      container:
        # Read-only observer; includes the POSIX shell used below. Pin the
        # verified multi-architecture digest as well as the kubectl version.
        image: alpine/kubectl:1.34.0@sha256:a98a63b456426205a1de5d78190df07ddfda535276902f14d3a21cd2789d47e4
        command: [/bin/sh, -ec]
        env:
          - {name: EXPECTED_VERSION, value: "{{inputs.parameters.version}}"}
          - {name: EXPECTED_TRAFFIC, value: "{{inputs.parameters.traffic}}"}
        args:
          - |
            case "${EXPECTED_VERSION}" in ''|*[!0-9]*) echo 'Expected numeric model version' >&2; exit 1;; esac
            case "${EXPECTED_TRAFFIC}" in absent|10) ;; *) echo 'Invalid traffic target' >&2; exit 1;; esac
            expected_uri="models:/iris-classifier/${EXPECTED_VERSION}"
            expected_traffic="${EXPECTED_TRAFFIC}"
            deadline="$(( $(date +%s) + 21600 ))"
            while [ "$(date +%s)" -lt "${deadline}" ]; do
              actual_uri="$(kubectl get inferenceservice iris-classifier -n mlops \
                -o jsonpath='{.spec.predictor.containers[0].env[?(@.name=="MODEL_URI")].value}' 2>/dev/null || true)"
              actual_traffic="$(kubectl get inferenceservice iris-classifier -n mlops \
                -o jsonpath='{.spec.predictor.canaryTrafficPercent}' 2>/dev/null || true)"
              generation="$(kubectl get inferenceservice iris-classifier -n mlops \
                -o jsonpath='{.metadata.generation}' 2>/dev/null || true)"
              observed_generation="$(kubectl get inferenceservice iris-classifier -n mlops \
                -o jsonpath='{.status.observedGeneration}' 2>/dev/null || true)"
              ready="$(kubectl get inferenceservice iris-classifier -n mlops \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
              if [ "${actual_uri}" = "${expected_uri}" ] && \
                 { [ "${expected_traffic}" = absent ] && [ -z "${actual_traffic}" ] || \
                   [ "${actual_traffic}" = "${expected_traffic}" ]; } && \
                 [ -n "${generation}" ] && [ "${observed_generation}" = "${generation}" ] && \
                 [ "${ready}" = True ]; then
                echo "KServe reconciled generation ${generation} and reports Ready."
                exit 0
              fi
              echo "Waiting for Argo CD to reconcile model=${expected_uri} traffic=${expected_traffic}"
              sleep 10
            done
            echo "Timed out waiting for the GitOps rollout to reach the cluster." >&2
            exit 1

    - name: report-status
      container:
        image: "{{workflow.parameters.release-automation-image}}"
        command: [python, -m, automation.model_release.report_status]
        env:
          - {name: LIFECYCLE_STATUS, value: "{{workflow.status}}"}
          - {name: LIFECYCLE_NAME, value: "{{workflow.name}}"}
          - {name: LIFECYCLE_FAILURES, value: "{{workflow.failures}}"}
