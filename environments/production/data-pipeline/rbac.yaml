apiVersion: v1
kind: ServiceAccount
metadata:
  name: iris-training
  namespace: argo
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_TRAINING_IRSA_ROLE_ARN
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: iris-kserve-rollout, namespace: mlops}
rules:
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: iris-training-kserve-rollout, namespace: mlops}
subjects:
  - {kind: ServiceAccount, name: iris-training, namespace: argo}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iris-kserve-rollout
