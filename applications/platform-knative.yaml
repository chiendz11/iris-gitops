apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-knative
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-35"}
spec:
  project: iris-production
  source:
    repoURL: https://github.com/chiendz11/iris-gitops.git
    targetRevision: main
    path: platform/knative
  destination: {server: "https://kubernetes.default.svc", namespace: knative-serving}
  # The Knative webhook controller expands the upstream bootstrap stubs into
  # complete webhook rules and owns their certificates at runtime. Ignore only
  # fields recorded under that controller's managed-fields identity on these
  # three named resources; Argo CD still owns the objects and every other field.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: webhook.serving.knative.dev
      managedFieldsManagers: [webhook]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: config.webhook.serving.knative.dev
      managedFieldsManagers: [webhook]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: validation.webhook.serving.knative.dev
      managedFieldsManagers: [webhook]
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
    retry: {limit: 10}
