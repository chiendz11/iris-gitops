apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-knative
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-35"}
spec:
  project: iris-production
  source:
    repoURL: https://github.com/chiendz11/iris-gitops.git
    targetRevision: main
    path: platform/knative
  destination: {server: "https://kubernetes.default.svc", namespace: knative-serving}
  # Knative injects and rotates these CA bundles at runtime. Ignore only that
  # controller-owned field; every other webhook field remains GitOps-managed.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: webhook.serving.knative.dev
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: config.webhook.serving.knative.dev
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: validation.webhook.serving.knative.dev
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
    retry: {limit: 10}
