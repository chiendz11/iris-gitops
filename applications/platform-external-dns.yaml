apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-dns
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-36"}
spec:
  project: iris-production
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.21.1
    helm:
      releaseName: external-dns
      valuesObject:
        provider:
          name: aws
        sources: [service]
        policy: sync
        registry: txt
        txtOwnerId: iris-mlops-prod
        domainFilters:
          - chienqtdemodeploy.app
        extraArgs:
          aws-zone-type: public
          zone-id-filter: Z088223230YYBEX6OYV2Y
        serviceAccount:
          create: true
          name: external-dns
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::980794397912:role/iris-mlops-prod-external-dns
            eks.amazonaws.com/sts-regional-endpoints: "true"
  destination: {server: "https://kubernetes.default.svc", namespace: external-dns}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 10}
