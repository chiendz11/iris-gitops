apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-knative-crds
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-36"}
spec:
  project: iris-production
  source:
    repoURL: https://github.com/chiendz11/iris-gitops.git
    targetRevision: main
    path: platform/knative-crds
  destination: {server: "https://kubernetes.default.svc", namespace: knative-serving}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 10}
