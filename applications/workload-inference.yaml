apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-inference
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "20"}
spec:
  project: iris-production
  source:
    repoURL: https://github.com/chiendz11/iris-gitops.git
    targetRevision: main
    path: environments/production/inference-service
  destination: {server: "https://kubernetes.default.svc", namespace: mlops}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    retry: {limit: 10}
