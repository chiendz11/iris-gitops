apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-secrets-config
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-39"}
spec:
  project: iris-production
  source:
    repoURL: https://github.com/chiendz11/iris-gitops.git
    targetRevision: main
    path: platform/external-secrets-config
  destination: {server: "https://kubernetes.default.svc", namespace: external-secrets}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true, SkipDryRunOnMissingResource=true]
    retry: {limit: 10}
