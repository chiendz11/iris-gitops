apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/knative/serving/releases/download/knative-v1.20.0/serving-core.yaml
  - https://github.com/knative-extensions/net-kourier/releases/download/knative-v1.20.0/kourier.yaml
patches:
  - target:
      version: v1
      kind: ConfigMap
      name: config-network
      namespace: knative-serving
    patch: |-
      - op: add
        path: /data/ingress-class
        value: kourier.ingress.networking.knative.dev
  - target:
      version: v1
      kind: Service
      name: kourier
      namespace: kourier-system
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          service.beta.kubernetes.io/aws-load-balancer-type: external
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          service.beta.kubernetes.io/aws-load-balancer-ssl-cert: REPLACE_PUBLIC_ACM_CERTIFICATE_ARN
          service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
          service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
          service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: TCP
          external-dns.alpha.kubernetes.io/hostname: REPLACE_KSERVE_HOSTNAME
      - op: replace
        path: /spec/ports/1/targetPort
        value: 8080
