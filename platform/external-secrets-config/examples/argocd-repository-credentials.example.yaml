# Enable while iris-gitops is still public, wait until this ExternalSecret is
# Ready, and only then change the repository visibility to private.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-repository-credentials
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: aws-secrets-manager}
  target:
    name: argocd-github-repository-credentials
    creationPolicy: Owner
    template:
      metadata:
        labels: {argocd.argoproj.io/secret-type: repo-creds}
      data:
        type: git
        url: https://github.com/chiendz11
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef: {key: REPLACE_ARGOCD_REPOSITORY_SECRET_ARN, property: username}
    - secretKey: token
      remoteRef: {key: REPLACE_ARGOCD_REPOSITORY_SECRET_ARN, property: token}
