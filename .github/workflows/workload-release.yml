name: workload-release

on:
  workflow_dispatch:
    inputs:
      contract:
        description: JSON workload-release-v1 intent
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  # Shared with model-release so their open-PR ownership checks cannot race.
  group: inference-desired-state-production
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AUTOMATION_ROLE_ARN: ${{ vars.GITOPS_AUTOMATION_AWS_ROLE_ARN }}
      AUTOMATION_SECRET_ARN: ${{ vars.GITOPS_AUTOMATION_SECRET_ARN }}
      INFERENCE_ALLOWED_ACTOR: ${{ vars.INFERENCE_RELEASE_ALLOWED_ACTOR }}
      MODEL_REGISTRY_ALLOWED_ACTOR: ${{ vars.MODEL_REGISTRY_RELEASE_ALLOWED_ACTOR }}
    steps:
      - name: Validate receiver configuration
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}"
          test -n "${AUTOMATION_ROLE_ARN}"
          test -n "${AUTOMATION_SECRET_ARN}"

      - name: Checkout authoritative desired state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned renderer dependencies
        run: pip install jsonschema==4.25.1 PyYAML==6.0.3

      - name: Validate workload release intent
        id: intent
        env:
          CONTRACT_JSON: ${{ inputs.contract }}
        run: |
          set -euo pipefail
          contract_file="${RUNNER_TEMP}/workload-release.json"
          printf '%s' "${CONTRACT_JSON}" > "${contract_file}"
          metadata="$(python -m automation.workload_release.renderer \
            --contract "${contract_file}" --validate-only)"
          {
            echo "contract_file=${contract_file}"
            echo "component=$(jq -r '.component' <<<"${metadata}")"
            echo "change_id=$(jq -r '.change_id' <<<"${metadata}")"
            echo "source_sha=$(jq -r '.source_sha' <<<"${metadata}")"
            echo "source_repository=$(jq -r '.source_repository' <<<"${metadata}")"
            echo "image_ref=$(jq -r '.image_ref // ""' <<<"${metadata}")"
            echo "facets=$(jq -r '.facets | join("+")' <<<"${metadata}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Authorize external workload publisher identity
        env:
          COMPONENT: ${{ steps.intent.outputs.component }}
          DISPATCH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "${COMPONENT}" in
            inference) expected_actor="${INFERENCE_ALLOWED_ACTOR}" ;;
            model-registry) expected_actor="${MODEL_REGISTRY_ALLOWED_ACTOR}" ;;
            release-automation)
              # Same-repository automation is authenticated by the exact Cosign
              # workflow identity checked below, not a cross-repo publisher App.
              exit 0
              ;;
            *) echo "Unsupported component: ${COMPONENT}" >&2; exit 1 ;;
          esac
          [[ "${expected_actor}" == *'[bot]' ]] || {
            echo "The component publisher actor is not configured." >&2
            exit 1
          }
          [[ "${DISPATCH_ACTOR}" == "${expected_actor}" ]] || {
            echo "Unauthorized ${COMPONENT} publisher actor: ${DISPATCH_ACTOR}" >&2
            exit 1
          }

      - name: Mint GitOps-owned pull-request token
        id: gitops-token
        uses: ./.github/actions/gitops-automation-token
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-arn: ${{ env.AUTOMATION_ROLE_ARN }}
          secret-arn: ${{ env.AUTOMATION_SECRET_ARN }}
          owner: ${{ github.repository_owner }}
          repository: iris-gitops

      - name: Block workload changes during model release or recovery proposals
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          set -euo pipefail
          open_model_releases="$(gh pr list \
            --state open --limit 1000 \
            --json headRefName,url \
            --jq '[.[] | select((.headRefName | startswith("release/model-v")) or (.headRefName | startswith("recovery/")))]')"
          if [[ "$(jq length <<<"${open_model_releases}")" -ne 0 ]]; then
            echo "Inference release is blocked while a model lifecycle PR is open:" >&2
            jq -r '.[].url' <<<"${open_model_releases}" >&2
            exit 1
          fi

      - name: Install Cosign for image provenance verification
        if: steps.intent.outputs.image_ref != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify immutable image signature and producer workflow
        if: steps.intent.outputs.image_ref != ''
        env:
          COMPONENT: ${{ steps.intent.outputs.component }}
          IMAGE_REF: ${{ steps.intent.outputs.image_ref }}
          SOURCE_REPOSITORY: ${{ steps.intent.outputs.source_repository }}
        run: |
          set -euo pipefail
          case "${COMPONENT}" in
            inference|model-registry) signing_workflow=ci.yml ;;
            release-automation) signing_workflow=release-automation-image.yml ;;
            *) echo "Unsupported image-producing component: ${COMPONENT}" >&2; exit 1 ;;
          esac
          certificate_identity="https://github.com/${SOURCE_REPOSITORY}/.github/workflows/${signing_workflow}@refs/heads/main"
          registry="${IMAGE_REF%%/*}"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${registry}"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}" >/dev/null

      - name: Render desired state on an isolated branch
        id: render
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          COMPONENT: ${{ steps.intent.outputs.component }}
          CHANGE_ID: ${{ steps.intent.outputs.change_id }}
          CONTRACT_FILE: ${{ steps.intent.outputs.contract_file }}
        run: |
          set -euo pipefail
          branch="release/workload-${COMPONENT}-${CHANGE_ID}"
          existing_url="$(gh pr list --state open --head "${branch}" --json url --jq '.[0].url // ""')"
          if [[ -n "${existing_url}" ]]; then
            echo "Existing release PR: ${existing_url}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git checkout -B "${branch}" origin/main
          python -m automation.workload_release.renderer \
            --contract "${CONTRACT_FILE}" --root .
          if git diff --quiet; then
            echo "Production desired state already matches this workload release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo "changed=true"
            echo "branch=${branch}"
          } >> "${GITHUB_OUTPUT}"

      - name: Open protected workload release pull request
        if: steps.render.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          BRANCH: ${{ steps.render.outputs.branch }}
          COMPONENT: ${{ steps.intent.outputs.component }}
          SOURCE_SHA: ${{ steps.intent.outputs.source_sha }}
          FACETS: ${{ steps.intent.outputs.facets }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          git config user.name "iris-gitops-automation[bot]"
          git config user.email "iris-gitops-automation[bot]@users.noreply.github.com"
          git add -- environments/production
          git commit -m "deploy(${COMPONENT}): ${FACETS} ${short_sha}"
          gh auth setup-git
          git push --force-with-lease origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "deploy(${COMPONENT}): ${FACETS} ${short_sha}" \
            --body "Renders a validated workload-release-v1 intent (${FACETS}). Solo policy: required CI and an operator-merged PR remain mandatory; Argo CD deploys only after merge."
