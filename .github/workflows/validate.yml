name: gitops-ci

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# This repository declares desired state. Deployment is Argo CD's responsibility;
# GitHub Actions intentionally receives no AWS or Kubernetes credentials.
permissions:
  contents: read

concurrency:
  group: gitops-ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  automation:
    name: automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: >-
          pip install jsonschema==4.25.1 PyJWT[crypto]==2.10.1
          PyYAML==6.0.3 pytest==8.4.2 requests==2.32.5 ruff==0.14.3
      - name: Install policy regression test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - run: ruff check automation
      - run: PYTHONPATH=. pytest -q automation
      - name: Lint lifecycle with the pinned Argo controller version (offline)
        env:
          ARGO_VERSION: v4.1.2
          ARGO_BINARY_SHA256: c7c3c70f8d7b3bcf07f3381af80280c702524209fd6d36accb671dc7d63dcc91
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/argo-linux-amd64.gz" \
            --output "${RUNNER_TEMP}/argo.gz"
          gzip --decompress --stdout "${RUNNER_TEMP}/argo.gz" > "${RUNNER_TEMP}/argo"
          echo "${ARGO_BINARY_SHA256}  ${RUNNER_TEMP}/argo" | sha256sum --check
          chmod u+x "${RUNNER_TEMP}/argo"
          "${RUNNER_TEMP}/argo" lint --offline --strict environments/production/data-pipeline/workflow-template.yaml
      - name: Refuse stale recovery proposals
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: python -m automation.recovery.check_pr --base "${BASE_SHA}"
      - name: Validate every versioned JSON Schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in sorted(Path("contracts").rglob("*.schema.json")):
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print(path)
          PY
      - name: Build release-automation image without publishing
        run: docker build --file automation/model_release/Dockerfile .

  render-schema:
    name: render-schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.34.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/kubeconform-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "${archive}"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" kubeconform
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Render every Kustomize root
        run: |
          set -euo pipefail
          render_dir="${RUNNER_TEMP}/rendered"
          mkdir -p "${render_dir}"

          mapfile -t roots < <(
            find applications platform environments/production \
              -type f -name kustomization.yaml -printf '%h\n' | sort -u
          )
          test "${#roots[@]}" -gt 0

          for root in "${roots[@]}"; do
            output_name="${root//\//__}.yaml"
            echo "Rendering ${root}"
            kubectl kustomize --network "${root}" > "${render_dir}/${output_name}"
          done

      - name: Validate rendered Kubernetes resources
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.34.0 \
            "${RUNNER_TEMP}/rendered"

  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install policy search dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Enforce GitOps repository policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash .github/scripts/policy-check.sh "${BASE_SHA}" "${HEAD_SHA}"

  # Keep this name stable and configure only this aggregate check as required.
  # Validation jobs may then be split or renamed without changing branch protection.
  validate:
    name: validate
    if: always()
    needs: [automation, render-schema, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          RENDER_RESULT: ${{ needs.render-schema.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
        run: |
          test "${AUTOMATION_RESULT}" = success
          test "${RENDER_RESULT}" = success
          test "${POLICY_RESULT}" = success
