name: gitops-ci

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# This repository declares desired state. Deployment is Argo CD's responsibility;
# GitHub Actions intentionally receives no AWS or Kubernetes credentials.
permissions:
  contents: read

concurrency:
  group: gitops-ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  automation:
    name: automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: >-
          pip install PyYAML==6.0.3 pytest==8.4.2 ruff==0.14.3
          -r automation/model-release-dispatcher/requirements.txt
      - run: >-
          ruff check .github/scripts .github/tests
          automation/model-release-dispatcher
      - run: >-
          PYTHONPATH=.github:automation/model-release-dispatcher pytest -q
          .github/tests automation/model-release-dispatcher/tests
      - name: Build dispatcher image without publishing
        run: >-
          docker build
          --file automation/model-release-dispatcher/Dockerfile
          automation/model-release-dispatcher

  render-schema:
    name: render-schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.33.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/kubeconform-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "${archive}"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" kubeconform
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Render every Kustomize root
        run: |
          set -euo pipefail
          render_dir="${RUNNER_TEMP}/rendered"
          mkdir -p "${render_dir}"

          mapfile -t roots < <(
            find applications platform environments/production \
              -type f -name kustomization.yaml -printf '%h\n' | sort -u
          )
          test "${#roots[@]}" -gt 0

          for root in "${roots[@]}"; do
            output_name="${root//\//__}.yaml"
            echo "Rendering ${root}"
            kubectl kustomize --network "${root}" > "${render_dir}/${output_name}"
          done

      - name: Validate rendered Kubernetes resources
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.33.0 \
            "${RUNNER_TEMP}/rendered"

  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository and comparison history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce GitOps repository policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash .github/scripts/policy-check.sh "${BASE_SHA}" "${HEAD_SHA}"

  # Keep this name stable and configure only this aggregate check as required.
  # Validation jobs may then be split or renamed without changing branch protection.
  validate:
    name: validate
    if: always()
    needs: [automation, render-schema, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          RENDER_RESULT: ${{ needs.render-schema.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
        run: |
          test "${AUTOMATION_RESULT}" = success
          test "${RENDER_RESULT}" = success
          test "${POLICY_RESULT}" = success
