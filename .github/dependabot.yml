version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /automation/model-release-dispatcher
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(dispatcher)
  - package-ecosystem: docker
    directory: /automation/model-release-dispatcher
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps(dispatcher)
