version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /automation/model_release
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps(release-automation)
  - package-ecosystem: docker
    directory: /automation/model_release
    # Python minor upgrades require a coordinated dependency/build validation.
    # Keep patch/digest updates enabled for the supported 3.12 runtime.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps(release-automation)
